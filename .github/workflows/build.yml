name: Build plugin

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
  workflow_call:

# Build artifacts only. This workflow cannot create releases or tags.
permissions:
  contents: read

concurrency:
  group: plugin-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify plugin build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      api-version: ${{ steps.describe.outputs.api-version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Test and validate x5 compatibility
        run: |
          go test ./...
          go vet ./...
          make plugin-check
      - name: Read plugin API from the built binary
        id: describe
        run: |
          ./packer-plugin-ansible-navigator describe > "$RUNNER_TEMP/plugin-description.json"
          python3 - "$RUNNER_TEMP/plugin-description.json" <<'PYTHON'
          import json, os, pathlib, re, sys
          description = json.loads(pathlib.Path(sys.argv[1]).read_text())
          version = pathlib.Path("version/VERSION").read_text().strip()
          assert description["version"] == version, "binary/version source mismatch"
          assert set(description["provisioners"]) == {"-packer-default-plugin-name-", "local"}
          api = description["api_version"]
          assert re.fullmatch(r"x[0-9]+\.[0-9]+", api), "invalid plugin API"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"api-version={api}\n")
          PYTHON

  build:
    name: Package ${{ matrix.os }}/${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Preserve the platforms provided by the previous build workflow.
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
          - {os: linux, arch: arm}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: '386'}
          - {os: freebsd, arch: amd64}
          - {os: freebsd, arch: '386'}
          - {os: freebsd, arch: arm}
          - {os: netbsd, arch: amd64}
          - {os: netbsd, arch: '386'}
          - {os: netbsd, arch: arm}
          - {os: openbsd, arch: amd64}
          - {os: openbsd, arch: '386'}
          - {os: openbsd, arch: arm}
          - {os: solaris, arch: amd64}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build and package
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          PLUGIN_API_VERSION: ${{ needs.verify.outputs.api-version }}
        run: >-
          python3 scripts/build_plugin.py
          --os "$TARGET_OS" --arch "$TARGET_ARCH"
          --api-version "$PLUGIN_API_VERSION" --output-dir dist
      - name: Install Packer for the native artifact smoke check
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: '1.14.2'
      - name: Verify and install the native package
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          PACKER_PLUGIN_PATH: ${{ runner.temp }}/packer-artifact-smoke
          CHECKPOINT_DISABLE: '1'
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess, tempfile, zipfile
          metadata = json.loads(pathlib.Path("dist/build-info.json").read_text())
          with tempfile.TemporaryDirectory() as directory:
              with zipfile.ZipFile(pathlib.Path("dist") / metadata["archive"]) as archive:
                  archive.extractall(directory)
              binary = pathlib.Path(directory) / metadata["binary"]
              assert hashlib.sha256(binary.read_bytes()).hexdigest() == metadata["binary_sha256"]
              binary.chmod(0o755)
              description = json.loads(subprocess.check_output([str(binary), "describe"], text=True))
              assert description["version"] == metadata["version"]
              assert description["api_version"] == metadata["api_version"]
              subprocess.run(["packer", "plugins", "install", "--path", str(binary),
                              "github.com/solomonhd/ansible-navigator"], check=True)
          PYTHON
      - name: Upload plugin package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: packer-plugin-ansible-navigator-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
